- name: "Install python3"
  become: yes
  tags:
    - pkg
  package:
    name:
      - python3
      - python3-pip
    state: latest


- name: "Install python3 pip modules"
  become: yes
  tags:
    - pkg
    - pip
  pip:
    name: "{{ almalinux_pip }}"
    state: latest
  when: not ansible_check_mode
