---
- name: "Disks"
  include_tasks: "disks.yml"

- name: "{{ ansible_distribution }}"
  include_tasks: "{{ ansible_distribution }}.yml"


- name: "Hostname"
  tags:
    - cfg
    - hostname
  hostname:
    name: "{{ hostname }}.{{ domain }}"


- name: "NTP"
  include_tasks: "ntp.yml"


- name: "Secure system files"
  tags:
    - cfg
  copy:
    src: "{{ item | basename }}"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: 0644
  with_items:
    - "/etc/at.allow"
    - "/etc/cron.allow"
    - "/etc/security/limits.conf"
    - "/etc/ssh/sshd_banner"


- name: "SSH daemon config"
  tags:
    - cfg
  lineinfile:
    path: "/etc/ssh/sshd_config"
    line: "Banner /etc/ssh/sshd_banner"
    regexp: "#?Banner\\s"
    owner: root
    group: root
    mode:  0600
  notify: "Restart sshd"


- name: "Syslog Config"
  tags:
    - cfg
    - logging
    - syslog
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
  notify: "Restart rsyslog"
  with_items:
    - { src: "ratelimit.conf.j2", dest: "/etc/rsyslog.d/01-ratelimit.conf" }
    - { src: "fluentd.conf.j2", dest: "/etc/rsyslog.d/99-fluentd.conf" }
  when:
    -  logging is defined and logging.server is defined


- name: "SELinux syslog port"
  tags:
    - cfg
    - logging
    - syslog
  seport:
    ports: "{{ fluentd_container.port.syslog }}"
    proto: tcp
    setype: syslogd_port_t
    state: present
  when:
    - logging is defined
    - logging.server is defined
    - fluentd_container.port.syslog is defined
    - syslog.protocol is defined
    - syslog.protocol == "tcp"



- name: "Log rotation"
  tags:
    - cfg
    - logging
    - syslog
  template:
    dest: "/etc/logrotate.conf"
    src: "logrotate.conf.j2"
    owner: root
    group: root
  when: logrotate is defined
  notify: "Restart logrotate"


- name: "Create Journald config file"
  shell:  "cp /usr/lib/systemd/journald.conf /etc/systemd/journald.conf"
  args:
    creates: "/etc/systemd/journald.conf"


- name: "Journald volatile"
  tags:
    - cfg
  lineinfile:
    path: "/etc/systemd/journald.conf"
    line: "Storage=volatile"
    regexp: "#?Storage="
    owner: root
    group: root
    mode:  0644
  notify: "Restart journald"


- name: "Utility packages"
  tags:
    - pkg
  package:
    name: 
      - jq
      - pv
      - rsync
      - unzip
    state: latest


- name: "Package update"
  include_tasks: "update.yml"


- name: "Services"
  include_tasks: "services.yml"
